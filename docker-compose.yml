x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    image: sanjiang-resources:latest
    restart: unless-stopped
    logging: *logging
    ports:
      # 默认只监听本机，对外发布请通过 HTTPS 反向代理；不要直接暴露到公网。
      - "127.0.0.1:4321:4321"
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      # 应用只在本机代理后面暴露：信任代理写入的单值 X-Forwarded-For，按访客限流。
      # 若把 4321 直接暴露给公网，请改为 0。
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_PATH: /app/data/site.sqlite
      MEDIA_DIR: /app/data/media
      MEDIA_QUOTA_BYTES: ${MEDIA_QUOTA_BYTES:-536870912}
      MEDIA_MIN_FREE_BYTES: ${MEDIA_MIN_FREE_BYTES:-134217728}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:-}
      TOTP_REQUIRED_FOR: ${TOTP_REQUIRED_FOR:-off}
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_UTC_HOUR: ${BACKUP_UTC_HOUR:-19}
      LINK_CHECK_UTC_HOUR: ${LINK_CHECK_UTC_HOUR:-20}
      LINK_CHECK_UTC_DAY: ${LINK_CHECK_UTC_DAY:-0}
      METRICS_CLEANUP_UTC_HOUR: ${METRICS_CLEANUP_UTC_HOUR:-18}
    volumes:
      - site-data:/app/data
      # 备份写到宿主机目录，避免和数据库放在同一个卷里一起丢。
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  maintenance:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    image: sanjiang-resources:latest
    restart: unless-stopped
    command: ["node", "scripts/maintenance.mjs"]
    # The application's HTTP health check does not apply to this worker.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
    environment:
      DATABASE_PATH: /app/data/site.sqlite
      MEDIA_DIR: /app/data/media
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_UTC_HOUR: ${BACKUP_UTC_HOUR:-19}
      LINK_CHECK_UTC_HOUR: ${LINK_CHECK_UTC_HOUR:-20}
      LINK_CHECK_UTC_DAY: ${LINK_CHECK_UTC_DAY:-0}
      METRICS_CLEANUP_UTC_HOUR: ${METRICS_CLEANUP_UTC_HOUR:-18}
    volumes:
      - site-data:/app/data
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups

volumes:
  site-data:
